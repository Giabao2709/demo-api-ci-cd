name: Production Monitor
on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi 1 giờ
  workflow_dispatch: # Cho phép bấm chạy bằng tay trên giao diện

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        # THAY ID DƯỚI ĐÂY BẰNG COLLECTION ID CỦA BẠN ĐÃ LẤY Ở BƯỚC 2
        run: postman collection run "59052161-87e83f07-a3fe-4bb9-9b19-74e0c99cacc1"
